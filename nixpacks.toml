[phases.setup]
nixPkgs = ["python311", "nodejs_20", "ffmpeg", "zlib", "gfortran", "openblas", "rustc", "cargo"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.install]
cmds = [
    "echo '=== Creating venv ==='",
    "python3 -m venv /opt/venv",
    "echo '=== Upgrading pip (venv) ==='",
    "/opt/venv/bin/pip install --upgrade pip",
    "echo '=== Installing Python Dependencies ==='",
    "/opt/venv/bin/pip install -r requirements.txt",
    "if [ \"${INSTALL_DEMUCS:-0}\" = \"1\" ]; then echo '=== Installing Demucs (optional) ==='; /opt/venv/bin/pip install -r requirements.demucs.txt; fi",
    "echo '=== Installing Frontend ==='",
    "cd frontend && npm ci"
]

[phases.build]
cmds = [
    "echo '=== Building Frontend ==='",
    "cd frontend && npm run build",
    "echo '=== Checking Frontend Build ==='",
    "ls -la frontend/dist"
]

[start]
cmd = "cd backend && /opt/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
